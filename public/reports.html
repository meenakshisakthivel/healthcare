<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cauvery Med | Reports</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-box">
          <div class="logo-icon small">CM</div>
          <div>
            <h2>CAUVERY MED</h2>
            <small>Medical Document Intelligence</small>
          </div>
        </div>
        <nav class="nav-menu">
          <a href="/dashboard.html">Dashboard</a>
          <a href="/patients.html">Patients</a>
          <a href="/upload.html">Upload Documents</a>
          <a href="/timeline.html">Medical Timeline</a>
          <a href="/documents.html">Document Search</a>
          <a class="active" href="/reports.html">Reports</a>
          <a href="/settings.html">Settings</a>
          <a href="#" id="logoutBtn">Logout</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Reports</p>
            <h1>Medical Reports</h1>
          </div>
        </header>

        <section class="panel">
          <h3>Upload Lab Report</h3>
          <div class="upload-controls">
            <label>Choose Patient
              <select id="labPatientSelect"></select>
            </label>
            <input type="file" id="labFileInput" multiple accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg" />
            <button id="labUploadBtn" class="btn btn-primary">Save Lab Document</button>
          </div>
          <div id="labUploadStatus" class="message-box"></div>
        </section>

        <section class="panel" style="margin-top: 20px;">
          <h3>Lab Result Tracking</h3>
          <div id="labResultsTable" class="table-wrap"></div>
        </section>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
